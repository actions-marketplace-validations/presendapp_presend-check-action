name: 'Presend Dependency Security Check'
description: 'Flags suspicious maintainer changes and known vulnerabilities in your npm dependencies. Free, no signup.'
author: 'presendapp'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  ecosystem:
    description: 'npm or pypi'
    required: false
    default: 'npm'
  manifest-path:
    description: 'Path to package.json (npm) or requirements.txt (pypi)'
    required: false
    default: ''
  checks:
    description: 'Comma-separated checks to run: maintainer,vulnerability. maintainer is npm-only and silently skipped for pypi.'
    required: false
    default: 'maintainer,vulnerability'
  fail-on-issue:
    description: 'Whether to fail the workflow if an issue is found'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Run Presend dependency check
      shell: bash
      env:
        ECOSYSTEM: ${{ inputs.ecosystem }}
        MANIFEST_PATH: ${{ inputs.manifest-path }}
        CHECKS: ${{ inputs.checks }}
        FAIL_ON_ISSUE: ${{ inputs.fail-on-issue }}
      run: node ${{ github.action_path }}/check.js
